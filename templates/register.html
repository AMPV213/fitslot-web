<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FITSLOT - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f7f6; 
            color: #333333; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        .auth-card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); 
            width: 100%; 
            max-width: 450px; 
        }
        .form-control { 
            background-color: #f8f9fa; 
            border: 1px solid #ced4da; 
            color: #333333; 
        }
        .form-control:focus { 
            background-color: #ffffff; 
            color: #333; 
            border-color: #2eb82e; 
            box-shadow: 0 0 0 0.25rem rgba(46, 184, 46, 0.25); 
        }
        .btn-green { 
            background: #2eb82e; 
            color: #ffffff; 
            font-weight: bold; 
            border: none; 
            transition: all 0.3s ease;
        }
        .btn-green:hover { 
            background: #248f24; 
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(46, 184, 46, 0.3);
        }
        .brand-text {
            color: #2eb82e;
            font-weight: 900;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 class="text-center mb-4 brand-text">CREATE ACCOUNT</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/register" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label text-secondary fw-semibold">Display Name</label>
            <input type="text" class="form-control" name="name" required placeholder="John Doe">
        </div>
        <div class="mb-3">
            <label class="form-label text-secondary fw-semibold">Username</label>
            <input type="text" class="form-control" name="username" required placeholder="johndoe123">
        </div>
        <div class="mb-3">
            <label class="form-label text-secondary fw-semibold">Password</label>
            <input type="password" class="form-control" name="password" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary fw-semibold">Profile Photo (Optional)</label>
            <input type="file" class="form-control" name="profile_photo" accept="image/*">
        </div>
        <button type="submit" class="btn btn-green w-100 py-2 mb-3">REGISTER</button>
    </form>
    
    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none text-secondary" style="font-size: 0.9rem;">
            Already have an account? <span style="color: #2eb82e; font-weight: bold;">Log in</span>
        </a>
    </div>
</div>

</body>
</html>
