<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FITSLOT - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body { 
            background-color: #f4f7f6; 
            color: #333333; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        .auth-card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); 
            width: 100%; 
            max-width: 400px; 
        }
        .form-control { 
            background-color: #f8f9fa; 
            border: 1px solid #ced4da; 
            color: #333333; 
        }
        .form-control:focus { 
            background-color: #ffffff; 
            color: #333; 
            border-color: #2eb82e; 
            box-shadow: 0 0 0 0.25rem rgba(46, 184, 46, 0.25); 
        }
        .btn-green { 
            background: #2eb82e; 
            color: #ffffff; 
            font-weight: bold; 
            border: none; 
            transition: all 0.3s ease;
        }
        .btn-green:hover { 
            background: #248f24; 
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(46, 184, 46, 0.3);
        }
        .brand-text {
            color: #2eb82e;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* Password Iris Button Styling */
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            font-size: 1.1rem;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: #2eb82e;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 class="text-center mb-4 brand-text">FITSLOT</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/">
        <div class="mb-3">
            <label class="form-label text-secondary fw-semibold">Username</label>
            <input type="text" class="form-control" name="username" required>
        </div>
        
        <div class="mb-4">
            <label class="form-label text-secondary fw-semibold">Password</label>
            <div class="password-wrapper">
                <input type="password" class="form-control pe-5" name="password" id="passwordInput" required>
                <i class="bi bi-eye-slash toggle-password" id="togglePasswordIcon"></i>
            </div>
        </div>
        
        <button type="submit" class="btn btn-green w-100 mb-3 py-2">LOGIN</button>
    </form>
    
    <div class="text-center mt-3">
        <a href="/register" class="text-decoration-none text-secondary" style="font-size: 0.9rem;">Need an account? <span style="color: #2eb82e; font-weight: bold;">Register here</span></a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');
        const passwordInput = document.getElementById('passwordInput');

        togglePasswordIcon.addEventListener('click', function () {
            // Check current input type and toggle it
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle the eye / eye-slash icon class
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });
    });
</script>

</body>
</html>
